name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # freshness dates require the full lesson history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check hand-written JS
        run: |
          for f in app.js investigations.js playground.js learning-guide.js quizzes.js sync.js ads.js analytics.js lesson-hashes.js; do
            [ -f "$f" ] && node --check "$f"
          done

      # Runs before the build so it fails loudly when someone edits app.js's
      # PATHS array (or a lesson file) and forgets to regenerate artifacts —
      # which is exactly how sw.js and the search index have drifted before.
      - name: Data integrity (committed state)
        run: npm run test:data

      # The social image is a separate, explicit build:og task because PNG
      # bytes vary across Chromium versions and would break this diff check.
      - name: Rebuild generated artifacts
        run: npm run build

      - name: Fail if generated artifacts were not committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/index.html >/dev/null && break
            sleep 1
          done

      - name: Smoke test all routes
        run: npm run test:smoke

      - name: Canonical pages and content safety
        run: npm run test:canonical

      - name: CVSS reference scoring
        run: npm run test:cvss

      # Guards the regression where a blocked CDN blanked every lesson.
      - name: CDN resilience (lessons render with jsdelivr blocked)
        run: npm run test:cdn
        env:
          BASE: http://127.0.0.1:8000

      # Contrast, touch targets, focus visibility, reduced-motion, and the
      # SVG card icons — checked in both themes.
      - name: UI quality (accessibility + motion + icons)
        run: npm run test:ui
        env:
          BASE: http://127.0.0.1:8000

      - name: Study planner (goals, backups, sync, offline, responsive layout)
        run: npm run test:planner
        env:
          BASE: http://127.0.0.1:8000

      - name: Incident Workbench (evidence, decisions, notes, sync, offline)
        run: npm run test:investigations
        env:
          BASE: http://127.0.0.1:8000

      - name: Learning Playground (guided experiments, Unicode, progress, offline)
        run: npm run test:playground
        env:
          BASE: http://127.0.0.1:8000

      - name: Starting guide (routes, progress, planner, backups, sync, offline)
        run: npm run test:guide
        env:
          BASE: http://127.0.0.1:8000

      - name: Lesson practice (return links, notes, progress, sync, offline)
        run: npm run test:lesson-practice
        env:
          BASE: http://127.0.0.1:8000

      - name: Flashcards (focused decks, finite sessions, scheduling, offline)
        run: npm run test:flashcards
        env:
          BASE: http://127.0.0.1:8000

      - name: Study review (completed lessons, due queue, focus, sync, offline)
        run: npm run test:study-review
        env:
          BASE: http://127.0.0.1:8000

      # Nothing graded before submit, a paper that survives a refresh, an
      # expired clock that submits rather than resumes.
      - name: Timed mock exam
        run: npm run test:exam
        env:
          BASE: http://127.0.0.1:8000

      # Chiefly guards what must NOT download: opening search should cost
      # nothing until a query is typed.
      - name: Search (two-tier index + linkable results)
        run: npm run test:search
        env:
          BASE: http://127.0.0.1:8000

      # Chiefly a negative check: no answer may be recoverable from the
      # tasks file the browser downloads.
      - name: Practice tasks (answer verification + explanation secrecy)
        run: npm run test:tasks
        env:
          BASE: http://127.0.0.1:8000

      - name: Render every lesson and open every lab
        run: npm run test:audit

      - name: Reader experience (resume, progress, prefetch, copy)
        run: npm run test:reader

      - name: Path roadmaps and runnable AppSec exercise
        run: npm run test:path-guides

      - name: Path discovery and complete offline practice
        run: npm run test:discovery

      - name: Lesson-aligned AppSec checks and review navigation
        run: npm run test:lesson-checks

      - name: Expert Labs, reproducible exercises, drafts and offline review
        run: npm run test:expert
